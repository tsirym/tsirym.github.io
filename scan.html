<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0d4d6b">
    <title>Scanner le QR code</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { -webkit-text-size-adjust: 100%; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #0d4d6b 0%, #FF6B35 100%);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            padding: 20px;
            color: #4a5568;
        }
        .wrap {
            width: 100%; max-width: 440px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 24px;
            padding: 32px 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: fadeIn .6s ease-out;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        h1 { color: #0d4d6b; font-size: 26px; text-align: center; margin-bottom: 20px; font-weight: 700; }
        .video-box {
            position: relative; width: 100%; aspect-ratio: 1 / 1; overflow: hidden;
            border-radius: 16px; background: #0b1f2a;
            box-shadow: 0 6px 20px rgba(13, 77, 107, .25);
        }
        video { width: 100%; height: 100%; object-fit: cover; display: block; }
        .frame {
            position: absolute; top: 18%; right: 18%; bottom: 18%; left: 18%;
            border: 3px solid #FF6B35; border-radius: 14px;
            box-shadow: 0 0 0 100vmax rgba(13, 77, 107, .35); pointer-events: none;
        }
        .status {
            min-height: 3em; margin: 16px 0 4px; text-align: center;
            font-size: 15px; line-height: 1.6; color: #4a5568;
        }
        .status.error {
            background: #fee; color: #c53030; padding: 12px 16px; border-radius: 12px;
            border-left: 4px solid #fc8181; font-weight: 500; text-align: left;
        }
        .status.ok { color: #15803d; font-weight: 700; }
        button, input[type=text], select {
            width: 100%; min-height: 48px; font-size: 16px; padding: 12px 14px; margin-top: 12px;
            border: 2px solid #e2e8f0; border-radius: 12px; background: #fff; color: #2d3748;
            transition: all .3s; font-family: inherit;
        }
        input[type=text]:focus, select:focus {
            outline: none; border-color: #0d4d6b; box-shadow: 0 0 0 3px rgba(13, 77, 107, .1);
        }
        input[type=text]::placeholder { color: #a0aec0; }
        button { font-weight: 600; cursor: pointer; color: #0d4d6b; border-color: #0d4d6b; }
        button:hover { background: rgba(13, 77, 107, .06); }
        button.primary {
            background: linear-gradient(135deg, #0d4d6b 0%, #FF6B35 100%);
            color: #fff; border: none; box-shadow: 0 4px 12px rgba(13, 77, 107, .4);
        }
        button.primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(13, 77, 107, .5); background: linear-gradient(135deg, #0d4d6b 0%, #FF6B35 100%); }
        .row { display: flex; gap: 10px; }
        .row > * { flex: 1; }
        .hint {
            display: block; margin-top: 18px; padding: 14px; border-radius: 12px;
            background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
            border-left: 4px solid #0d4d6b; font-size: 13px; line-height: 1.6; color: #4a5568;
        }
        .foot { margin-top: 18px; text-align: center; font-size: 13px; color: #718096; opacity: .7; }
        .hidden { display: none !important; }
        hr { border: 0; border-top: 1px solid #e2e8f0; margin: 22px 0 6px; }
        @media (max-width: 480px) {
            body { padding: 15px; }
            .wrap { padding: 28px 22px; }
            h1 { font-size: 22px; }
        }
    </style>
</head>
<body>
<div class="wrap">
    <h1>Hi-Scan Kaody QR </h1>

    <div class="video-box" id="videoBox">
        <video id="video" playsinline muted autoplay></video>
        <div class="frame"></div>
    </div>

    <div class="status" id="status">Tsindrio ilay hoe « Hanokatra caméra ».</div>

    <button class="primary" id="startBtn" type="button">Hanokatra caméra</button>
    <select id="camSelect" class="hidden" aria-label="Choisir la caméra"></select>

    <div class="row">
        <button type="button" id="photoBtn">Haka any @ Galery</button>
        <button type="button" id="backBtn">Hiverina</button>
    </div>
    <input type="file" id="photoInput" accept="image/*" capture="environment" class="hidden">

    <hr>
    <input type="text" id="manualCode" placeholder="Na ampidiro eto ilay Kaody voucher"
           autocapitalize="none" autocorrect="off" autocomplete="off" spellcheck="false">
    <button type="button" id="manualBtn">Hi-connecte @ io Kaody io</button>

    <p class="hint">
        Raha tsy misokatra ilay Camerà dia sokafy @ navigateur (Chrome ou Safari) ity pejy ity
        (fa tsy eo amin'ilay box connexion Wi-Fi) ary autoriseo ny caméra.
    </p>
    <p class="foot">Cyberstar Andafiavaratra - 2026</p>
</div>

<canvas id="canvas" class="hidden"></canvas>

<script>
(function () {
    // Where to send the phone back: the hotspot login URL, passed by login.html as ?back=...
    var params = new URLSearchParams(location.search);
    var backUrl = params.get('back') || '';
    if (!/^https?:\/\//i.test(backUrl)) backUrl = '';

    var video = document.getElementById('video');
    var canvas = document.getElementById('canvas');
    var statusEl = document.getElementById('status');
    var startBtn = document.getElementById('startBtn');
    var camSelect = document.getElementById('camSelect');
    var stream = null, loopTimer = null, busy = false, detector = null, done = false;

    function say(text, cls) {
        statusEl.textContent = text;
        statusEl.className = 'status' + (cls ? ' ' + cls : '');
    }

    function extractVoucher(text) {
        text = (text || '').trim();
        var m = text.match(/[?&](?:username|user|code|voucher)=([^&#\s]+)/i);
        if (m) { try { return decodeURIComponent(m[1]); } catch (e) { return m[1]; } }
        return text;
    }

    function finish(raw) {
        var code = extractVoucher(raw);
        if (!code || done) return;
        done = true;
        stopCamera();
        say('Code trouvé : ' + code + ' — connexion...', 'ok');
        if (!backUrl) {
            say('Code trouvé : ' + code + '. Retournez sur la page Wi-Fi et tapez-le.', 'ok');
            return;
        }
        var sep = backUrl.indexOf('?') === -1 ? '?' : '&';
        setTimeout(function () {
            location.href = backUrl + sep + 'voucher=' + encodeURIComponent(code);
        }, 400);
    }

    function stopCamera() {
        if (loopTimer) { clearInterval(loopTimer); loopTimer = null; }
        if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; }
    }

    // ---- decoding: native BarcodeDetector first, jsQR (loaded on demand) as fallback ----
    // Tries jsQR.js sitting next to this page first (no extra host to allow in the walled garden),
    // then the public CDN.
    var JSQR_SOURCES = ['jsQR.js', 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js'];

    function loadScript(src) {
        return new Promise(function (resolve, reject) {
            var s = document.createElement('script');
            s.src = src;
            s.onload = function () { window.jsQR ? resolve() : reject(new Error('empty')); };
            s.onerror = function () { reject(new Error('load')); };
            document.head.appendChild(s);
        });
    }

    var jsqrPromise = null;
    function loadJsQR() {
        if (window.jsQR) return Promise.resolve();
        if (!jsqrPromise) {
            jsqrPromise = JSQR_SOURCES.reduce(function (p, src) {
                return p.catch(function () { return loadScript(src); });
            }, Promise.reject(new Error('start')));
            jsqrPromise.catch(function () { jsqrPromise = null; });
        }
        return jsqrPromise;
    }

    function decode(cnv) {
        if ('BarcodeDetector' in window) {
            try {
                if (!detector) detector = new BarcodeDetector({ formats: ['qr_code'] });
                return detector.detect(cnv).then(function (r) { return r && r.length ? r[0].rawValue : null; })
                    .catch(function () { return null; });
            } catch (e) { /* fall through */ }
        }
        return loadJsQR().then(function () {
            var ctx = cnv.getContext('2d');
            var img = ctx.getImageData(0, 0, cnv.width, cnv.height);
            var res = jsQR(img.data, img.width, img.height, { inversionAttempts: 'attemptBoth' });
            return res ? res.data : null;
        }).catch(function () {
            say('Le lecteur de QR n\'a pas pu se charger (jsQR.js introuvable). Tapez le code du voucher ci-dessous.', 'error');
            return null;
        });
    }

    // ---- camera ----
    function withTimeout(promise, ms) {
        return Promise.race([
            promise,
            new Promise(function (_, reject) { setTimeout(function () { reject({ name: 'TimeoutError' }); }, ms); })
        ]);
    }

    function explain(err) {
        var n = err && err.name;
        if (n === 'NotAllowedError' || n === 'SecurityError')
            return 'Caméra refusée. Autorisez la caméra pour ce site, ou ouvrez cette page dans Chrome/Safari.';
        if (n === 'NotFoundError' || n === 'OverconstrainedError')
            return 'Aucune caméra trouvée sur cet appareil. Utilisez « Prendre une photo » ou tapez le code.';
        if (n === 'NotReadableError' || n === 'AbortError')
            return 'La caméra est utilisée par une autre application. Fermez-la puis réessayez.';
        if (n === 'TimeoutError')
            return 'Tsy mamaly ilay caméra. Sokafy any @ Chrome/Safari ity pejy ity, na ampiasao ilay hoe « Haka any @ Galery ».';
        return 'Impossible d\'ouvrir la caméra. Utilisez « Prendre une photo » ou tapez le code.';
    }

    function tryConstraints(list, i, lastErr) {
        if (i >= list.length) return Promise.reject(lastErr);
        return withTimeout(navigator.mediaDevices.getUserMedia(list[i]), 10000)
            .catch(function (e) {
                // permission problems won't be fixed by other constraints
                if (e && (e.name === 'NotAllowedError' || e.name === 'SecurityError')) throw e;
                return tryConstraints(list, i + 1, e);
            });
    }

    function startCamera(deviceId) {
        if (!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia) || !window.isSecureContext) {
            say('Tsy miainga eto ny caméra, tsy eken`ity fitaovana ity (page non sécurisée). Ampiasao ilay hoe « Haka any @ Galery ».', 'error');
            return;
        }
        stopCamera();
        done = false;
        say('Eo ampanokafana ny caméra... autoriseo l\'accès ra anotaniana.');
        var list = deviceId
            ? [{ video: { deviceId: { exact: deviceId } }, audio: false }, { video: true, audio: false }]
            : [{ video: { facingMode: { ideal: 'environment' } }, audio: false },
               { video: { facingMode: 'user' }, audio: false },
               { video: true, audio: false }];

        tryConstraints(list, 0, null).then(function (s) {
            stream = s;
            video.srcObject = s;
            return video.play().catch(function () {});
        }).then(function () {
            if (!stream) return;
            say('Ataovy anaty Cadre ilay Kaody QR.');
            startBtn.textContent = 'Verenana sokafana ilay caméra';
            listCameras();
            loopTimer = setInterval(scanFrame, 300);
        }).catch(function (e) {
            say(explain(e), 'error');
        });
    }

    function listCameras() {
        if (!navigator.mediaDevices.enumerateDevices) return;
        navigator.mediaDevices.enumerateDevices().then(function (devs) {
            var cams = devs.filter(function (d) { return d.kind === 'videoinput'; });
            if (cams.length < 2) { camSelect.classList.add('hidden'); return; }
            var current = stream && stream.getVideoTracks()[0] && stream.getVideoTracks()[0].getSettings().deviceId;
            camSelect.innerHTML = '';
            cams.forEach(function (c, i) {
                var o = document.createElement('option');
                o.value = c.deviceId;
                o.textContent = c.label || ('Caméra ' + (i + 1));
                if (c.deviceId === current) o.selected = true;
                camSelect.appendChild(o);
            });
            camSelect.classList.remove('hidden');
        }).catch(function () {});
    }

    function scanFrame() {
        if (busy || done || !video.videoWidth) return;
        busy = true;
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0);
        decode(canvas).then(function (text) {
            busy = false;
            if (text) finish(text);
        });
    }

    // ---- photo fallback (works even when the live camera is blocked) ----
    function scanPhoto(file) {
        if (!file) return;
        say('Lecture de la photo...');
        var url = URL.createObjectURL(file);
        var img = new Image();
        img.onload = function () {
            var scale = Math.min(1, 1200 / Math.max(img.width, img.height));
            canvas.width = Math.round(img.width * scale);
            canvas.height = Math.round(img.height * scale);
            canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
            URL.revokeObjectURL(url);
            decode(canvas).then(function (text) {
                if (text) finish(text);
                else say('Aucun QR code trouvé. Rapprochez-vous et réessayez.', 'error');
            });
        };
        img.onerror = function () { say('Photo illisible.', 'error'); };
        img.src = url;
    }

    startBtn.addEventListener('click', function () { startCamera(); });
    camSelect.addEventListener('change', function () { startCamera(camSelect.value); });
    document.getElementById('photoBtn').addEventListener('click', function () {
        document.getElementById('photoInput').click();
    });
    document.getElementById('photoInput').addEventListener('change', function () {
        scanPhoto(this.files && this.files[0]);
        this.value = '';
    });
    document.getElementById('backBtn').addEventListener('click', function () {
        stopCamera();
        if (backUrl) location.href = backUrl; else history.back();
    });
    document.getElementById('manualBtn').addEventListener('click', function () {
        finish(document.getElementById('manualCode').value);
    });

    window.addEventListener('pagehide', stopCamera);
    startCamera();   // try right away; the button is there if the browser wants a tap first
})();
</script>
</body>
</html>
